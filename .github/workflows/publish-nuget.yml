name: Publish NuGet

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build & Pack (Release)
        working-directory: src/Blacus.SlackAPIWrapper/Blacus.SlackAPIWrapper
        run: dotnet build ./SlackAPIWrapper.csproj -c Release

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blacus.SlackAPIWrapper.nupkg
          path: src/Blacus.SlackAPIWrapper/Blacus.SlackAPIWrapper/bin/Release/Blacus.SlackAPIWrapper.*.nupkg
          if-no-files-found: error

      - name: Publish to NuGet
        working-directory: src/Blacus.SlackAPIWrapper/Blacus.SlackAPIWrapper
        run: dotnet nuget push ./bin/Release/Blacus.SlackAPIWrapper.*.nupkg --api-key "${NUGET_API_KEY}" --source nuget.org --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
