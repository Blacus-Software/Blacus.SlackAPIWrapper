name: Publish NuGet

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build & Pack (Release)
        working-directory: src/Blacus.SlackAPIWrapper/Blacus.SlackAPIWrapper
        run: dotnet build ./SlackAPIWrapper.csproj -c Release

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blacus.SlackAPIWrapper.nupkg
          path: src/Blacus.SlackAPIWrapper/Blacus.SlackAPIWrapper/bin/Release/Blacus.SlackAPIWrapper.*.nupkg
          if-no-files-found: error

      - name: Validate NuGet API Key Secret
        run: |
          if [ -z "${NUGET_API_KEY}" ]; then
            echo "::error::NUGET_API_KEY secret is not set or empty! Please configure it in repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Publish to NuGet
        working-directory: src/Blacus.SlackAPIWrapper/Blacus.SlackAPIWrapper
        run: dotnet nuget push ./bin/Release/Blacus.SlackAPIWrapper.*.nupkg --api-key "${NUGET_API_KEY}" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
