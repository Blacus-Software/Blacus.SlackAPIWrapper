name: CI

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore src/Blacus.SlackAPIWrapper/Blacus.SlackAPIWrapper.sln

      - name: Build
        run: dotnet build src/Blacus.SlackAPIWrapper/Blacus.SlackAPIWrapper.sln -c Release --no-restore

      - name: Run Tests
        run: dotnet test src/Blacus.SlackAPIWrapper/Blacus.SlackAPIWrapper.sln -c Release --no-build --verbosity normal
